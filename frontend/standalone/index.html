<div class="card panel five"><div class="panel-head"><div class="ph"><div class="ph-icon">⌁</div><div><b>LOAD FORECAST</b><span>Next 48 hours · AI prediction</span></div></div><span class="badge">✦ XGBoost</span></div>${loadChart()}</div>
<div class="card panel five"><div class="panel-head"><div class="ph"><div class="ph-icon">☼</div><div><b>RENEWABLE FORECAST</b><span>Weather-aware generation</span></div></div><div class="seg" id="renewSeg"><button class="on" onclick="renew('solar',this)">Solar</button><button onclick="renew('wind',this)">Wind</button></div></div><div id="renewChart">${renewChart('solar')}</div></div>
<div class="card panel wide opt"><div class="panel-head"><div class="ph"><div class="ph-icon">✦</div><div><b>ENERGY OPTIMIZATION · TODAY</b><span>Dispatch strategy vs baseline</span></div></div><span class="badge">SIMULATION</span></div><div class="opt-body"><div><div class="donut"><div class="donut-text"><div><b>4,487</b><span>kWh optimized</span></div></div></div><div class="donut-caption">DISPATCH MIX</div></div><div><div class="opt-row"><span>● Renewables used</span><strong>41%</strong></div><div class="opt-row"><span>● Battery discharge</span><strong>24%</strong></div><div class="opt-row"><span>● Diesel / CHP</span><strong>29%</strong></div><div class="opt-row"><span>● Load shifted</span><strong>6%</strong></div><div class="divider"></div><div class="mini-grid"><div class="mini"><span>Fuel saved</span><b>184 L</b><em>+12.4%</em></div><div class="mini"><span>CO₂ avoided</span><b>483 kg</b><em>+9.1%</em></div><div class="mini"><span>Cost saved</span><b>₹23.6k</b><em>Today</em></div><div class="mini"><span>Reliability</span><b>99.98%</b><em>Critical load</em></div></div></div></div></div>
<div class="card panel fuel"><div class="panel-head"><div class="ph"><div class="ph-icon">◌</div><div><b>FUEL RESILIENCE</b><span>Strategic reserve outlook</span></div></div></div><div class="fuel-core"><div class="gauge"></div><div class="gauge-center"><small>REMAINING</small><b>218,400</b> <span>L</span></div><div class="fuel-days"><strong>174 days</strong>to projected exhaustion</div></div><div class="fuel-cells"><div><span>Avg/day</span><b>1,250 L</b></div><div><span>Projected need</span><b>245k L</b></div></div><div class="risk"><strong>⚠ Reserve watch active</strong>Conservation mode at &lt; 30k L buffer.</div></div>
<div class="card panel"><div class="panel-head"><div class="ph"><div class="ph-icon">▤</div><div><b>SYSTEM STATUS</b><span>Component health</span></div></div></div>${status()}</div>
<div class="card panel alerts"><div class="panel-head"><div class="ph"><div class="ph-icon">!</div><div><b>ACTIVE ALERTS</b><span>2 events need attention</span></div></div><button class="btn" onclick="toast('Opening full event audit trail…')">View all</button></div>${alert('warn','⚠','High fuel consumption','GEN 1 is 12% above optimal range.','10:15 AM','warning')}${alert('info','◐','Polar night approaching','Solar generation expected to drop over 35 days.','09:40 AM','info')}<div class="maint">◷ <span>Generator 2 service</span><b>in 2 days</b></div></div>
</div>
<div class="controls"><div class="control"><label>SYSTEM MODE</label><div class="seg" id="mode"><button class="on" onclick="mode('Normal',this)">Normal</button><button class="warn" onclick="mode('Fuel Conservation',this)">Fuel Conservation</button><button class="danger" onclick="mode('Emergency',this)">Emergency</button></div></div><div class="control"><label>OPTIMIZATION HORIZON</label><div class="seg" id="horizon"><button class="on" onclick="horizon('24 Hours',this)">24 Hours</button><button onclick="horizon('7 Days',this)">7 Days</button><button onclick="horizon('30 Days',this)">30 Days</button><button onclick="horizon('180 Days',this)">180 Days</button></div></div><div class="run"><div class="last">LAST OPTIMIZATION<b id="last">Today, 09:45 AM</b></div><button class="run-btn" id="run" onclick="optimize()">✦ Run optimization</button></div></div><div class="footer"><span>◇ Control actions are simulation-safe</span><span>Model confidence 96.4% · Data quality 99.1%</span></div>`}
function kpi(a,b,c,d,e,i,t,p){return `<div class="card kpi ${t}"><div class="kpi-top"><span>${a}</span><div class="kpi-icon">${i}</div></div><div class="kpi-value">${b}<span>${c}</span></div><div class="kpi-bottom"><span>${d}</span><b>${e}</b></div>${p!=null?`<div class="meter"><span style="width:${p}%"></span></div>`:''}</div>`}
function flow(){return `<div class="flow"><div class="node green"><div class="nicon">☼</div><div><label>SOLAR ARRAY</label><b>42 kW</b><small>48 panels active</small></div></div><div class="flow-arrow">→</div><div class="node green"><div class="nicon">≈</div><div><label>WIND FARM</label><b>61 kW</b><small>9 turbines · 64%</small></div></div><div class="flow-arrow">→</div><div class="node orange"><div class="nicon">▣</div><div><label>DIESEL / CHP</label><b>87 kW</b><small>GEN 1 · 87% load</small></div></div><div class="core"><div class="core-content"><div class="z">ϟ</div><b>187</b><span>kW LOAD</span></div></div><div class="side-node battery"><div class="node cyan"><div class="nicon">▣</div><div><label>BATTERY</label><b>72%</b><small>−48 kW discharge</small></div></div></div><div class="side-node thermal"><div class="node orange"><div class="nicon">♨</div><div><label>THERMAL / CHP</label><b>112 kWth</b><small>Heating demand</small></div></div></div><div class="flow-legend"><span class="legend"><i class="lg green"></i>Generation</span><span class="legend"><i class="lg cyan"></i>Battery</span><span class="legend"><i class="lg orange"></i>Thermal</span></div></div>`}
function linePath(vals){const w=100,h=100,step=w/(vals.length-1);return vals.map((v,i)=>`${i?'L':'M'} ${i*step} ${h-v}`).join(' ')}
function loadChart(){let f=[48,55,66,75,66,61,70,84,92,83,71,58,62,76,87,80];let a=[45,52,64,70,62,60,68,80,86,76,70,null,null,null,null,null];let af= a.map((v,i)=>v==null?null:[i,v]);return `<div class="chart"><div class="axis"><span>100</span><span>200</span><span>300 kW</span></div><div class="plot">${svg(`<path d="${linePath(f)}" fill="none" stroke="${'#68dcff'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`)}${svg('<path d="M 0 55 L 12 51 L 25 38 L 37 34 L 50 42 L 62 31 L 75 25 L 87 38" fill="none" stroke="#d7e9f5" stroke-width="1.2" vector-effect="non-scaling-stroke"/>')}</div><div class="chart-legend"><span><i class="l-cyan"></i>Forecast</span><span><i class="l-white"></i>Actual</span><span style="margin-left:auto">MAE 8.6 kW · 96.1% confidence</span></div></div>`}
function renewChart(mode){let vals=mode==='solar'?[8,0,22,52,77,70,62,0,0,18,45,72,84,66,33,0]:[55,59,53,62,74,69,64,59,51,48,56,68,79,73,67,58];let color=mode==='solar'?'#ffd469':'#68dcff';return `<div class="chart"><div class="axis"><span>0</span><span>40</span><span>80 kW</span></div><div class="plot">${svg(`<path d="${linePath(vals)}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`)} </div><div class="chart-legend"><span><i style="background:${color}"></i>${mode==='solar'?'Solar':'Wind'} forecast</span><span style="margin-left:auto">Weather model · ERA5 + station telemetry</span></div></div>`}
function status(){let arr=[['◉','Generators','1 / 3 running'],['☼','Solar system','Operational'],['≈','Wind system','Operational'],['▣','Battery system','Operational'],['♨','Thermal / CHP','Operational'],['◌','Weather station','Operational']];return `<div class="status-list">${arr.map(x=>`<div class="status-row"><span>${x[0]}</span><span>${x[1]}</span><strong>${x[2]}</strong><i class="ok"></i></div>`).join('')}</div>`}
function alert(cls,ic,title,body,time,type){return `<div class="alert ${cls}" onclick="toast('${type==='warning'?'Generator 1 is outside its optimal efficiency band.':'Forecast recommends increasing wind + battery reserve.'}')"><div class="alert-icon">${ic}</div><div style="flex:1"><strong>${title}</strong><time>${time}</time><p>${body}</p><div class="detail">View details ↗</div></div></div>`}
function moduleView(name){let sub={"Live Monitor":"Real-time telemetry and component status.","Energy Flow":"Trace power generation, storage, and consumption.","Forecasting":"AI demand and renewable prediction workspace.","Optimization":"Constraint-aware dispatch and fuel minimization.","Fuel Management":"Strategic fuel reserve and risk forecasting.","Battery Management":"State-of-charge, health, and dispatch trajectory.","Reports & Analytics":"Historical KPIs and baseline comparisons.","Alerts & Events":"Warnings, events, maintenance, and audit trail.","Settings":"Station policy and model behavior controls.","Help & Documentation":"Architecture, workflows, and operator guidance."};return `<div class="head"><div><div class="eyebrow">AURORA MODULE</div><h1>${name}</h1><p>${sub[name]||''}</p></div><div class="actions"><div class="sync">↻ Data synced 58s ago</div><button class="btn" onclick="toast('Export prepared for '+${JSON.stringify(name)}+'.')">⇩ Export</button></div></div><div class="grid12"><div class="card panel wide" style="padding-bottom:16px"><div class="panel-head"><div class="ph"><div class="ph-icon">✦</div><div><b>${name.toUpperCase()}</b><span>AURORA operational workspace</span></div></div><span class="badge">LIVE</span></div><div style="padding:20px"><div style="font-size:55px;font-weight:900;letter-spacing:-.06em">${name==='Live Monitor'?'187':'96.4'}<span style="font-size:15px;color:#6b8aa0">${name==='Live Monitor'?' kW':'% confidence'}</span></div><p style="font-size:9px;color:#648398;max-width:760px;line-height:1.8">${name==='Optimization'?'AURORA combines AI forecasts with constraint-aware optimization to decide generator dispatch, battery usage, renewable allocation, load shifting, and fuel reserve preservation.':name==='Fuel Management'?'Track fuel inventory, daily consumption, reserve buffers, projected exhaustion date, and conservation-mode triggers across seasonal Antarctic scenarios.':name==='Forecasting'?'Forecast station demand and renewable generation using weather, historical load, occupancy, thermal demand, and equipment state features.':'This module is ready for live station telemetry. The prototype uses simulation-safe data so operator actions cannot affect real equipment.'}</p><div class="grid12" style="margin-top:18px">${kpi('PRIMARY KPI',name==='Optimization'?'6.8':'187',name==='Optimization'?'% fuel saving':'kW',name==='Optimization'?'vs baseline':'station state','live demo','✦','cyan')}${kpi('MODEL', '96.4','%','confidence','stable','✦','green')}${kpi('SYSTEM','99.98','%','critical uptime','stable','◇','green')}</div></div></div><div class="card panel five"><div class="panel-head"><div class="ph"><div class="ph-icon">⌁</div><div><b>SIMULATION TRACE</b><span>Last 12 events</span></div></div></div><div style="padding:0 15px">${['10:15 Fuel alert raised','09:45 Optimization completed','09:12 Wind forecast updated','08:52 Generator 2 maintenance scheduled','08:30 Battery reserve recalculated'].map((x,i)=>`<div style="display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #173148;font-size:8px"><span style="color:#55748a;width:45px">${x.slice(0,5)}</span><i class="ok" style="margin-top:2px;background:${i===0?'#ffad5c':'#66e6a5'}"></i><span>${x.slice(6)}</span></div>`).join('')}</div></div></div>`}
function render(name){document.getElementById('view').innerHTML=name==='Overview'?overview():moduleView(name)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastId);window.toastId=setTimeout(()=>t.classList.remove('show'),3200)}
function toggleMenu(){document.getElementById('layout').classList.toggle('open')}
function renew(type,el){document.querySelectorAll('#renewSeg button').forEach(b=>b.classList.remove('on'));el.classList.add('on');document.getElementById('renewChart').innerHTML=renewChart(type)}
function mode(x,el){document.querySelectorAll('#mode button').forEach(b=>b.classList.remove('on'));el.classList.add('on');toast('System mode set to '+x+'. Simulation only.')}
function horizon(x,el){document.querySelectorAll('#horizon button').forEach(b=>b.classList.remove('on'));el.classList.add('on');toast('Optimization horizon changed to '+x+'.')}
function optimize(){const b=document.getElementById('run');b.textContent='↻ Optimizing…';b.disabled=true;setTimeout(()=>{b.textContent='✓ Optimization complete';document.getElementById('last').textContent='Just now';b.disabled=false;toast('Optimization complete. 6.8% fuel savings found for the current scenario.')},1400)}
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active');render(n.dataset.view);document.getElementById('layout').classList.remove('open')}));
render('Overview');
</script></body></html>
